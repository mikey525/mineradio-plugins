<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mineradio 插件市场</title>
  <meta name="description" content="Mineradio 插件市场：歌词预设、界面工具与音源插件的官方目录">
  <style>
    :root {
      --bg: #0a0c10;
      --panel: rgba(18, 21, 27, .86);
      --line: rgba(255, 255, 255, .09);
      --text: #e8eaef;
      --dim: #9aa3b2;
      --accent: #4ed5bd;
      --accent-2: #7c8cff;
      --radius: 14px;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background:
        radial-gradient(1200px 600px at 80% -10%, rgba(78, 213, 189, .08), transparent 60%),
        radial-gradient(900px 500px at 0% 100%, rgba(124, 140, 255, .07), transparent 60%),
        var(--bg);
      color: var(--text);
      font: 14px/1.6 system-ui, -apple-system, "Segoe UI", "Noto Sans SC", sans-serif;
      min-height: 100vh;
    }
    a { color: inherit; text-decoration: none; }

    header {
      position: sticky; top: 0; z-index: 20;
      display: flex; align-items: center; gap: 14px;
      padding: 14px clamp(16px, 4vw, 48px);
      background: rgba(10, 12, 16, .82);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line);
    }
    .brand { display: flex; align-items: baseline; gap: 8px; font-weight: 700; letter-spacing: .5px; }
    .brand b { font-size: 18px; }
    .brand span { color: var(--accent); font-size: 15px; font-weight: 600; }
    .stats { margin-left: auto; color: var(--dim); font-size: 13px; }
    .stats b { color: var(--text); }

    .toolbar {
      display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
      padding: 18px clamp(16px, 4vw, 48px) 6px;
    }
    #q {
      flex: 1 1 260px; max-width: 460px;
      padding: 10px 14px; border-radius: 10px;
      border: 1px solid var(--line); background: rgba(255, 255, 255, .04); color: var(--text);
      font: inherit; outline: none;
    }
    #q:focus { border-color: rgba(78, 213, 189, .5); }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      padding: 7px 14px; border-radius: 999px; cursor: pointer;
      border: 1px solid var(--line); background: rgba(255, 255, 255, .03);
      color: var(--dim); font-size: 13px; user-select: none;
    }
    .chip.on { color: #101116; background: var(--accent); border-color: var(--accent); font-weight: 600; }

    main {
      display: grid; gap: 14px;
      padding: 18px clamp(16px, 4vw, 48px) 60px;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    }
    .card {
      display: flex; flex-direction: column; gap: 10px;
      padding: 16px; border-radius: var(--radius);
      border: 1px solid var(--line); background: var(--panel);
      cursor: pointer; transition: transform .15s ease, border-color .15s ease;
    }
    .card:hover { transform: translateY(-2px); border-color: rgba(78, 213, 189, .35); }
    .card h3 { margin: 0; font-size: 16px; display: flex; align-items: center; gap: 8px; }
    .card .ver { color: var(--dim); font-size: 12px; font-weight: 400; }
    .card .meta { color: var(--dim); font-size: 12px; display: flex; gap: 10px; flex-wrap: wrap; }
    .card p { margin: 0; color: #c6ccd8; font-size: 13px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .card .foot { display: flex; align-items: center; gap: 10px; margin-top: auto; }
    .tag { font-size: 11px; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--dim); }
    .tag.cat { color: var(--accent-2); border-color: rgba(124, 140, 255, .35); }
    .dl {
      margin-left: auto; padding: 7px 16px; border-radius: 9px;
      background: var(--accent); color: #101116; font-weight: 700; font-size: 13px;
    }

    .mask {
      position: fixed; inset: 0; z-index: 50;
      display: flex; align-items: center; justify-content: center;
      padding: 20px; background: rgba(0, 0, 0, .62); backdrop-filter: blur(4px);
    }
    .mask[hidden] { display: none; }
    .sheet {
      width: min(720px, 100%); max-height: 86vh; overflow: auto;
      border-radius: 18px; border: 1px solid var(--line);
      background: #11141a; padding: 24px;
    }
    .sheet h2 { margin: 0 0 4px; font-size: 20px; }
    .sheet .sub { color: var(--dim); font-size: 13px; margin-bottom: 16px; }
    .sheet pre {
      white-space: pre-wrap; word-break: break-word;
      background: rgba(255, 255, 255, .04); border: 1px solid var(--line);
      border-radius: 10px; padding: 14px; color: #cfd5e1; font: 13px/1.7 ui-monospace, Consolas, monospace;
    }
    .kv { display: grid; grid-template-columns: 96px 1fr; gap: 6px 12px; font-size: 13px; margin: 14px 0; }
    .kv dt { color: var(--dim); }
    .kv dd { margin: 0; word-break: break-all; }
    .sheet .row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
    .btn {
      padding: 10px 18px; border-radius: 10px; border: 1px solid var(--line);
      background: rgba(255, 255, 255, .04); color: var(--text); font: inherit; cursor: pointer;
    }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #101116; font-weight: 700; }
    .close { margin-left: auto; }

    footer {
      padding: 26px clamp(16px, 4vw, 48px) 44px; border-top: 1px solid var(--line);
      color: var(--dim); font-size: 13px; line-height: 1.9;
    }
    footer b { color: var(--text); }
    code { background: rgba(255, 255, 255, .06); padding: 1px 6px; border-radius: 5px; font-family: ui-monospace, Consolas, monospace; }
    .empty { grid-column: 1 / -1; text-align: center; color: var(--dim); padding: 60px 0; }
  </style>
</head>

<body>
  <header>
    <div class="brand"><b>Mineradio</b><span>插件市场</span></div>
    <div class="stats"><b id="stat-n">0</b> 个插件 · <span id="stat-size">0 MB</span></div>
  </header>

  <div class="toolbar">
    <input id="q" type="search" placeholder="搜索插件名、作者或说明…" autocomplete="off">
    <div id="cats" class="chips"></div>
  </div>

  <main id="grid"></main>

  <div id="detail" class="mask" hidden>
    <div class="sheet" role="dialog" aria-modal="true">
      <div id="detail-body"></div>
      <div class="row">
        <button class="btn primary" id="detail-dl">下载插件</button>
        <button class="btn close" id="detail-close">关闭</button>
      </div>
    </div>
  </div>

  <footer>
    <b>安装方式</b><br>
    1. 打开 Mineradio →「扩展插件」→「在线插件商店」→「仓库管理」。<br>
    2. 添加本页地址：<code id="repo-url">加载中…</code>（指向 <code>plugins.json</code>）。<br>
    3. 回到商店列表，选择插件安装即可；更新时保持插件 ID 不变即可自动识别。<br>
    <br>
    <b>说明</b>：所有插件包均来自本地打包，已计算 SHA-256；安装前 Mineradio 会按目录中的校验值复核文件。部分插件自带的第三方库与字体遵循各自许可证（见包内 LICENSE / NOTICE）。
  </footer>

"}, {"id": "mr-lx-source", "name": "自定义音源（LX）", "version": "2.0.5", "author": "Mineradio Plugin", "description": "第三方自定义音源插件：内置 LX Music 自定义源协议运行时（Web Worker 沙箱），支持导入任意 .js 音源脚本。启用后无需登录任何平台账号即可搜索并播放歌曲，搜索栏会自动并入该音源的结果。2.0.5：声明了 qs 时只在「声明平台」里多出一个 QS 胶囊，不再附加任何文字说明。2.0.4：修掉真正的汽水问题 —— lx-worker.js 的平台白名单（SUPPORT_ACTIONS/SUPPORT_QUALITYS）里没有 qs，verifySources() 会把脚本声明的汽水整块丢弃，宿主只收到 wy/tx/kg/kw/mg，于是汽水歌永远解析不了。现在 qs 进入白名单（动作/音质同样做交集，脚本里的 192k 这类宿主没有映射的档位会被自然过滤）。2.0.2：新增「声明平台有没有汽水」的检测 —— 脚本 inited 里声明的平台键会归一化（qishui / QS / 汽水 / netease / 酷狗 等写法都认），汽水映射为 LX 短码 qs；新增 MrLxSource.supports(平台) / supportsQishui() / platforms()，汽水歌曲在音源声明了 qs 时会直接走该音源解析而不是一律跨平台找歌。2.0.1：修复切到宿主「系统」页时本插件的「音源」页签跟着一起高亮的问题（不再给按钮设 data-fx-tab，高亮改由插件自行维护）。2.0.0：面板改为与桌面版一致的「音源管理」形态 —— 已添加的源列表（版本/作者/大小/声明平台）+ 本地导入（多选）+ 在线导入（走宿主 /api/proxy 代理下载，绕过浏览器跨域，支持 Gitee/GitHub raw 等）+ 删除确认 + 在线检查更新；移除内置音源与音源测试。保留播放直链兜底、未登录直连、搜索并入，以及「识别试听片段 → 自动跨平台找完整版」的补源能力。不改动宿主一行代码。", "category": "音源", "url": "packages/mr-lx-source-2.0.5.zip", "size": 66668, "sha256": "ec18c61a8664bbb27ff4aa7c018c1b2111e4a645b64ef220d94ee78e1ee756c4", "minAppVersion": "", "license": ""}, {"id": "nebbia-preset", "name": "雾笺预设", "version": "1.1.0", "author": "Mineradio / Folia (chthollyphile)", "description": "雾玻璃按笔顺写歌词，新增水族箱、凝露萤虫与融雪，保留旧版参数", "category": "歌词预设", "url": "packages/nebbia-preset-1.1.0.zip", "size": 2154327, "sha256": "164963d70c2d58314764142acc4b33751ed560455a63ce2d354de2db912538ce", "minAppVersion": "", "license": "AGPL-3.0-only"}, {"id": "partita-preset", "name": "云阶预设", "version": "1.1.0", "author": "Mineradio / Folia (chthollyphile)", "description": "歌词沿引导线逐块错落下行，像一级级云中阶梯", "category": "歌词预设", "url": "packages/partita-preset-1.1.0.zip", "size": 335731, "sha256": "79e1f53902420573a48f639a99d9d8880890f23b5bae2916a6edddadbf208b16", "minAppVersion": "", "license": "AGPL-3.0-only"}, {"id": "pendolo-preset", "name": "时计预设", "version": "1.5.0", "author": "Mineradio / Folia (chthollyphile)", "description": "封面嵌进钟表盘，歌词沿弧线随擒纵一格格推过", "category": "歌词预设", "url": "packages/pendolo-preset-1.5.0.zip", "size": 362819, "sha256": "ad3dc2da2289d6e2f75c45e2525cd7a83eb787dd6d1d9735180a4e1b43549976", "minAppVersion": "", "license": "AGPL-3.0-only"}, {"id": "portrait-mode", "name": "横竖屏切换", "version": "1.0.1", "author": "Mineradio", "description": "独立竖屏界面，按钮切换横屏/竖屏；横屏支持左右旋转，启动恢复上次选择。需配套方向控制版主程序。", "category": "界面工具", "url": "packages/portrait-mode-1.0.1.zip", "size": 18488, "sha256": "4a03d0e83106a760773f78a2b8a874716c12fb22c14cfe485735c613c0b76338", "minAppVersion": "", "license": ""}, {"id": "sonnet-preset", "name": "商籁预设", "version": "1.5.0", "author": "Mineradio / Folia (chthollyphile)", "description": "短线、边框与镂空巨字轮番铺开，歌词像被排进一页页翻动的诗稿", "category": "歌词预设", "url": "packages/sonnet-preset-1.5.0.zip", "size": 737486, "sha256": "0ac5df757eb5bdbf6629c5d7390bb2284fb615e739b42fa0026d5bd87fb50b6f", "minAppVersion": "", "license": "AGPL-3.0-only"}, {"id": "tempera-preset", "name": "凝彩预设", "version": "1.1.0", "author": "Mineradio / Folia (chthollyphile)", "description": "成片的色块与细密网点缓缓重组，歌词压过颜色时翻出反色", "category": "歌词预设", "url": "packages/tempera-preset-1.1.0.zip", "size": 683593, "sha256": "629a3e12a199749fe2c6e0ef92941200b962533f78d47a8be8391ad1a3807288", "minAppVersion": "", "license": "AGPL-3.0-only"}, {"id": "tilt-preset", "name": "倾诉预设", "version": "1.1.0", "author": "Mineradio / Folia (chthollyphile)", "description": "长句自动断行、随机斜体强调，像有人凑近低声说话", "category": "歌词预设", "url": "packages/tilt-preset-1.1.0.zip", "size": 350869, "sha256": "57a8a668f15fa493fd354cd8832665addd2dc1e2c1107ff100ea63e77b4d5eee", "minAppVersion": "", "license": "AGPL-3.0-only"}]};
    const CATS = ['全部', '歌词预设', '界面工具', '音源'];
    let active = '全部';
    let keyword = '';

    const $ = (s) => document.querySelector(s);
    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
    const mb = (n) => n >= 1048576 ? (n / 1048576).toFixed(2) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB';

    function chips() {
      const box = $('#cats');
      box.innerHTML = '';
      CATS.forEach((c) => {
        const el = document.createElement('div');
        el.className = 'chip' + (c === active ? ' on' : '');
        el.textContent = c;
        el.onclick = () => { active = c; render(); };
        box.appendChild(el);
      });
    }

    function match(p) {
      if (active !== '全部' && p.category !== active) return false;
      if (!keyword) return true;
      const hay = (p.name + ' ' + p.author + ' ' + p.description + ' ' + p.id).toLowerCase();
      return hay.includes(keyword);
    }

    function render() {
      chips();
      const grid = $('#grid');
      const list = DATA.plugins.filter(match);
      grid.innerHTML = '';
      if (!list.length) {
        grid.innerHTML = '<div class="empty">没有匹配的插件</div>';
        return;
      }
      list.forEach((p) => {
        const card = document.createElement('article');
        card.className = 'card';
        card.innerHTML =
          '<h3>' + esc(p.name) + ' <span class="ver">v' + esc(p.version) + '</span></h3>' +
          '<div class="meta"><span class="tag cat">' + esc(p.category) + '</span>' +
          '<span>' + esc(p.author) + '</span><span>' + mb(p.size) + '</span></div>' +
          '<p>' + esc(p.description) + '</p>' +
          '<div class="foot"><span class="tag">' + esc(p.id) + '</span>' +
          '<a class="dl" href="' + esc(p.url) + '" download onclick="event.stopPropagation()">下载</a></div>';
        card.onclick = () => openDetail(p);
        grid.appendChild(card);
      });
      $('#stat-n').textContent = DATA.plugins.length;
      const total = DATA.plugins.reduce((a, b) => a + b.size, 0);
      $('#stat-size').textContent = mb(total);
    }

    let current = null;
    function openDetail(p) {
      current = p;
      $('#detail-body').innerHTML =
        '<h2>' + esc(p.name) + ' <span class="ver" style="color:var(--dim);font-size:13px">v' + esc(p.version) + '</span></h2>' +
        '<div class="sub">' + esc(p.author) + ' · ' + esc(p.category) + ' · ' + mb(p.size) + '</div>' +
        '<pre>' + esc(p.description) + '</pre>' +
        '<dl class="kv">' +
        '<dt>插件 ID</dt><dd>' + esc(p.id) + '</dd>' +
        '<dt>版本</dt><dd>' + esc(p.version) + '</dd>' +
        (p.minAppVersion ? '<dt>最低版本</dt><dd>Mineradio ' + esc(p.minAppVersion) + '</dd>' : '') +
        '<dt>许可证</dt><dd>' + esc(p.license || '未声明') + '</dd>' +
        '<dt>SHA-256</dt><dd><code>' + esc(p.sha256) + '</code></dd>' +
        '<dt>文件</dt><dd><code>' + esc(p.url) + '</code></dd>' +
        '</dl>';
      $('#detail-dl').onclick = () => {
        const a = document.createElement('a');
        a.href = p.url; a.download = ''; a.click();
      };
      $('#detail').hidden = false;
    }

    $('#detail-close').onclick = () => { $('#detail').hidden = true; };
    $('#detail').onclick = (e) => { if (e.target === $('#detail')) $('#detail').hidden = true; };
    $('#q').addEventListener('input', (e) => { keyword = e.target.value.trim().toLowerCase(); render(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') $('#detail').hidden = true; });

    $('#repo-url').textContent = location.href.replace(/[^/]*$/, '') + 'plugins.json';
    render();
  </script>
</body>

</html>
